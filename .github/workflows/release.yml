name: Windows portable release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - shell: pwsh
        run: ./scripts/build-portable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Folio-Windows-x64
          path: release/Folio-Windows-x64.zip
